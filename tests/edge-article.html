<style>
html { scroll-behavior: smooth; }

<header>固定导航栏 · 滚动截图回归测试</header>
<article><h1>长文章：从标题到文末的完整截图</h1><div id="text"></div><p id="end">文章结束 · END-OF-ARTICLE-142857</p></article>
<script>
for (let i=1; i<=42; i++) {
 const p=document.createElement('p'); p.textContent=`第 ${String(i).padStart(2,'0')} 段。这里用长短不同的文字检验滚动拼接，包含标点、段间空白和固定导航栏。第 ${i} 段必须完整保留，不能把空白区域当成页面底部。`;
 document.querySelector('#text').append(p);
 if(i===14 || i===28) { const d=document.createElement('div'); d.className='gap'; document.querySelector('#text').append(d); }
}
</script></html>
